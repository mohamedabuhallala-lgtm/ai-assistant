<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الأخبار الذكي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { background-color: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 85%; max-width: 400px; text-align: center; max-height: 85vh; overflow-y: auto; }
        h2 { color: #333; margin-bottom: 10px; }
        button { width: 100%; padding: 12px; background-color: #2a5298; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        button:hover { background-color: #1e3c72; }
        #resultBox { margin-top: 20px; text-align: right; background: #f4f7f6; padding: 15px; border-radius: 8px; border: 1px solid #ddd; display: none; font-size: 14px; color: #333; }
        .news-item { border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 10px; }
        .news-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    </style>
</head>
<body>

    <div class="container">
        <h2>مساعد الأخبار 📰</h2>
        <p style="color: #666; margin-bottom: 20px;">بضغطة زر، سيتصل التطبيق برابط الـ API لجلب أحدث البيانات.</p>
        
        <button onclick="fetchData()">جلب الأخبار الآن</button>
        
        <!-- هنا ستظهر الأخبار القادمة من الرابط -->
        <div id="resultBox"></div>
    </div>

    <script>
        function fetchData() {
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';
            resultBox.innerHTML = 'جاري الاتصال بالخادم لجلب البيانات... ⏳';

            // هذا هو الرابط الذي أرسلته لي
            const apiUrl = 'https://newsdata.io/api/1/latest?apikey=YOUR_API_KEY&q=US%20tariffs&prioritydomain=top';

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if(data.status === "success" && data.results) {
                        let html = '';
                        // عرض أول 3 أخبار
                        for(let i=0; i < Math.min(3, data.results.length); i++) {
                            html += '<div class="news-item"><strong>' + data.results[i].title + '</strong></div>';
                        }
                        resultBox.innerHTML = html;
                    } else {
                        // هذه الرسالة ستظهر لأن كلمة YOUR_API_KEY تحتاج إلى تغيير لمفتاحك الحقيقي
                        resultBox.innerHTML = '❌ عذراً، لا يمكن جلب الأخبار. يرجى التأكد من وضع مفتاح API الحقيقي الخاص بك بدلاً من كلمة "YOUR_API_KEY" في الكود.';
                    }
                })
                .catch(error => {
                    resultBox.innerHTML = '❌ حدث خطأ في الاتصال.';
                });
        }
    </script>
</body>
</html>
